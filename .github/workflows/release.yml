# A tag vX.Y.Z publishes a GitHub release whose asset is the extension, ready for
# brave://extensions (or chrome://extensions) -> Developer mode -> Load unpacked:
# unzip it and select the folder linkedin-feed-guard-X.Y.Z (ADR-0014).
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the Load-unpacked ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: The tag is the manifest's version, and the tests pass
        run: |
          set -euo pipefail
          python3 tools/package.py --tag "${GITHUB_REF_NAME}"
          node --test tests/*.test.cjs

      - name: Build the ZIP and its checksum
        run: python3 tools/package.py --out dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/package.py --notes > notes.md
          cat >> notes.md <<'MD'

          ## Install

          1. Download `linkedin-feed-guard-${{ github.ref_name }}.zip` below and unzip it into a permanent folder.
          2. Open `brave://extensions` (`chrome://extensions` in Chrome) and turn on **Developer mode**.
          3. Choose **Load unpacked** and select the unzipped folder, the one containing `manifest.json`.
          4. Reload your LinkedIn tabs.

          To update, copy the new folder's contents over your existing extension folder and click **Reload**, so the extension keeps its ID and settings. Verify the download with the `.sha256` file.
          MD
          sed -i "s/linkedin-feed-guard-v/linkedin-feed-guard-/" notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.zip.sha256 \
            --title "LinkedIn Feed Guard ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
