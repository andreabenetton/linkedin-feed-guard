  The 16 and 32 px drawing: icon.svg simplified so the shield and the pause
  badge still read on a toolbar; the faded cards would blur at this size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <path d="M15 4 L25 7.5 V15 C25 21 21 25.5 15 28 C9 25.5 5 21 5 15 V7.5 Z"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <rect x="10" y="11" width="10" height="3" rx="1" fill="#ffffff"/>
  <circle cx="24" cy="24" r="8" fill="#f59e0b"/>
  <rect x="20.5" y="20" width="2.6" height="8" fill="#ffffff"/>
  <rect x="24.9" y="20" width="2.6" height="8" fill="#ffffff"/>
</svg>
