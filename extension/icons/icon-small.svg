  The 16 and 32 px drawing: icon.svg simplified so the shield still reads on a
  toolbar; the faded cards would blur at this size. No badge is drawn: the
  browser's own action badge carries the post count (ADR-0016).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <path d="M16 4 L26 7.5 V15 C26 21 22 25.5 16 28 C10 25.5 6 21 6 15 V7.5 Z"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <rect x="11" y="11" width="10" height="3" rx="1" fill="#ffffff"/>
  <rect x="11" y="17" width="10" height="3" rx="1" fill="#ffffff" fill-opacity="0.55"/>
</svg>
