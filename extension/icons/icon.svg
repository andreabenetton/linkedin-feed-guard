<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- shield: the guard -->
  <path d="M64 18 L100 30 V60 C100 84 85 101 64 110 C43 101 28 84 28 60 V30 Z"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <!-- three feed cards; the lower two faded: rendering deferred off screen -->
  <rect x="44" y="40" width="40" height="11" rx="4" fill="#ffffff"/>
  <rect x="44" y="57" width="40" height="11" rx="4" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="44" y="74" width="30" height="11" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <!-- pause badge: off-screen video paused -->
  <circle cx="98" cy="98" r="22" fill="#f59e0b" stroke="#ffffff" stroke-width="5"/>
  <rect x="89" y="88" width="6" height="20" rx="2" fill="#ffffff"/>
  <rect x="101" y="88" width="6" height="20" rx="2" fill="#ffffff"/>
</svg>
