version = 1

[[annotations]]
path = [
  "extension/manifest.json",
  "extension/_locales/**/messages.json",
  "extension/rules/*.json",
  "extension/icons/**",
  "tests/silent.webm",
  "test-results/**",
  "SHA256SUMS",
]
precedence = "aggregate"
